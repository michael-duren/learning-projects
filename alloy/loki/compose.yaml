# Keep the original project name so moving this directory preserves existing volumes.
name: alloy

services:
  app:
    build: ./app
    volumes:
      - logs:/logs

  alloy:
    image: grafana/alloy:v1.20.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - logs:/logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - app
      - loki

  loki:
    image: grafana/loki:3.5.3
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  logs:
  alloy-data:
  loki-data:
  grafana-data:
